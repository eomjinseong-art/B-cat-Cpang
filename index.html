<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="고양이와 집사를 위한 용품 큐레이션">
  <title>숨숨마을 | 고양이 용품 큐레이션</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 text-stone-800" style="font-family:'Gowun Dodum', sans-serif">
  <header class="sticky top-0 z-20 border-b border-amber-100 bg-white/95 backdrop-blur">
    <div class="mx-auto max-w-5xl px-4 py-3">
      <div class="flex items-center justify-between gap-3">
        <a href="./" class="text-2xl font-black tracking-wide text-orange-600" style="font-family:'Jua', sans-serif">숨숨마을 <span class="hidden text-base font-medium tracking-normal text-stone-400 sm:inline">CAT GOODS</span></a>
        <a id="headerLink" href="#" target="_blank" rel="noopener" class="shrink-0 rounded-full bg-orange-500 px-3 py-2 text-xs font-bold text-white">오늘의 골드박스</a>
      </div>
      <nav class="mt-2 flex gap-4 text-sm font-bold">
        <a href="./" class="text-stone-900">고양이 용품</a>
        <a href="./wiki/" class="text-stone-400 hover:text-orange-600">숨숨위키</a>
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-5xl px-4 pb-40">
    <section class="pt-4 pb-3">
      <p class="mb-1 hidden text-xs font-bold text-orange-600 sm:block">집사님을 위한 오늘의 큐레이션</p>
      <h1 id="heroTitle" class="text-xl font-black leading-snug sm:text-2xl lg:text-3xl">고양이의 하루를 더 편안하게</h1>
      <p id="heroDescription" class="mt-1 line-clamp-1 text-xs leading-5 text-stone-500 sm:mt-2 sm:text-sm sm:leading-6">검증된 고양이 용품을 한눈에 살펴보세요.</p>
      <p class="mt-1 overflow-hidden whitespace-nowrap text-[10px] leading-5 text-stone-400 sm:text-[11px]">이 포스팅은 쿠팡 파트너스 활동으로 수수료를 제공받습니다.</p>
    </section>
    <section class="mb-3 flex items-center gap-1.5 overflow-x-auto pb-1">
      <a href="./wiki/" class="shrink-0 text-xs font-bold text-orange-600">숨숨위키</a>
      <a href="./wiki/16-ileol-ttaen.html" class="shrink-0 rounded-full bg-white px-2.5 py-1 text-xs font-bold text-stone-600 hover:text-orange-600">이럴 땐</a>
      <a href="./wiki/08-body-language.html" class="shrink-0 rounded-full bg-white px-2.5 py-1 text-xs font-bold text-stone-600 hover:text-orange-600">바디랭귀지</a>
      <a href="./wiki/03-saryo-yeongyang.html" class="shrink-0 rounded-full bg-white px-2.5 py-1 text-xs font-bold text-stone-600 hover:text-orange-600">사료</a>
      <a href="./wiki/04-hwajangsil.html" class="shrink-0 rounded-full bg-white px-2.5 py-1 text-xs font-bold text-stone-600 hover:text-orange-600">화장실</a>
      <a href="./wiki/" class="shrink-0 text-xs font-bold text-stone-400 hover:text-orange-600">전체 →</a>
    </section>
    <nav class="sticky top-[5.5rem] z-10 -mx-4 mb-5 border-b border-amber-100 bg-amber-50/95 px-4 py-2 backdrop-blur">
      <div class="flex items-center gap-2">
        <button type="button" id="categoryAll" data-category="전체" class="shrink-0 rounded-full px-4 py-2 text-xs font-bold">전체</button>
        <div id="categoryScroll" class="flex min-w-0 flex-1 gap-2 overflow-x-auto pb-1"></div>
      </div>
    </nav>
    <div id="status" class="rounded-xl bg-white p-8 text-center text-sm text-stone-400">상품을 불러오는 중입니다.</div>
    <section id="productGrid" class="hidden grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-4"></section>
  </main>
  <div id="modal" class="fixed inset-0 z-30 hidden items-end justify-center bg-black/50 p-0 sm:items-center sm:p-4">
    <article class="max-h-[90vh] w-full max-w-lg overflow-y-auto rounded-t-3xl bg-white p-5 sm:rounded-3xl">
      <div class="mb-4 flex justify-between"><span id="modalCategory" class="rounded-full bg-orange-50 px-2 py-1 text-xs font-bold text-orange-600"></span><button id="closeModal" class="text-2xl text-stone-400" aria-label="닫기">&times;</button></div>
      <img id="modalImage" class="mb-4 h-64 w-full rounded-2xl object-cover" alt="">
      <h2 id="modalTitle" class="text-lg font-black"></h2>
      <p id="modalDescription" class="mt-2 text-sm leading-6 text-stone-500"></p>
      <a id="modalLink" target="_blank" rel="noopener" class="mt-6 block rounded-xl bg-orange-500 py-3 text-center text-sm font-bold text-white">쿠팡에서 상품 확인하기</a>
    </article>
  </div>
  <script>
    const CATEGORIES = ['고양이 사료', '고양이 모래', '고양이 간식', '스크래처 및 캣타워', '위생 및 화장실 용품', '장난감', '그루밍', '기타'];
    const state = { products: [], category: '전체' };
    const $ = id => document.getElementById(id);
    fetch('./data/config.json').then(response => response.json()).then(config => {
      $('heroTitle').textContent = config.hero.title;
      $('heroDescription').textContent = config.hero.description;
      $('headerLink').href = config.featuredLink;
      $('headerLink').textContent = config.featuredLabel;
    });
    fetch('./data/products.json').then(response => {
      if (!response.ok) throw new Error('상품 데이터 응답 오류');
      return response.json();
    }).then(products => {
      state.products = uniqueProducts(products).filter(item =>
        item.product?.imageUrl?.endsWith('.jpg') && !/^고양이 용품 추천 /.test(item.product.title || '')
      );
      renderCategories();
      renderProducts();
    }).catch(error => {
      $('status').textContent = '상품을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';
      console.error(error);
    });
    function uniqueProducts(list) {
      const seen = new Set();
      return list.filter(item => {
        const title = item.product?.title || '';
        const key = item.product?.productId
          || (!/^고양이 용품 추천 /.test(title) && title)
          || item.product?.coupangUrl;
        if (!key || seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }
    function buttonClass(category) {
      return `shrink-0 rounded-full px-4 py-2 text-xs font-bold ${category === state.category ? 'bg-stone-900 text-white' : 'bg-white text-stone-500'}`;
    }
    function renderCategories() {
      $('categoryAll').className = buttonClass('전체');
      const used = new Set(state.products.map(item => item.category));
      const visible = CATEGORIES.filter(category => used.has(category));
      $('categoryScroll').innerHTML = visible.map(category =>
        `<button type="button" data-category="${escapeHtml(category)}" class="${buttonClass(category)}">${escapeHtml(category)}</button>`
      ).join('');
      $('categoryAll').onclick = () => selectCategory('전체');
      $('categoryScroll').querySelectorAll('button').forEach(button => {
        button.addEventListener('click', () => selectCategory(button.dataset.category));
      });
    }
    function selectCategory(category) {
      state.category = category;
      renderCategories();
      renderProducts();
      $('productGrid').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    function visibleProducts() {
      const filtered = state.category === '전체'
        ? state.products
        : state.products.filter(item => item.category === state.category);
      return filtered.slice().sort((a, b) => {
        const aPhoto = a.product.imageUrl.endsWith('.jpg') ? 0 : 1;
        const bPhoto = b.product.imageUrl.endsWith('.jpg') ? 0 : 1;
        return aPhoto - bPhoto || a.id - b.id;
      });
    }
    function renderProducts() {
      const products = visibleProducts();
      $('status').classList.toggle('hidden', products.length > 0);
      $('productGrid').classList.toggle('hidden', products.length === 0);
      $('status').textContent = products.length
        ? ''
        : state.category === '전체'
          ? '표시할 상품이 없습니다.'
          : `${state.category} 상품이 없습니다.`;
      $('productGrid').innerHTML = products.map(item => `<a href="${escapeHtml(item.product.coupangUrl)}" target="_blank" rel="noopener sponsored" class="overflow-hidden rounded-2xl border border-amber-100 bg-white text-left shadow-sm transition hover:-translate-y-1 hover:shadow-md"><img src="${escapeHtml(item.product.imageUrl)}" alt="${escapeHtml(item.product.title)}" class="h-40 w-full object-cover" loading="lazy" onerror="this.onerror=null;this.src='./images/products/product-${String(item.id).padStart(3, '0')}.svg'"><div class="p-3"><span class="text-[11px] font-bold text-orange-600">#${escapeHtml(item.category || '추천')}</span><h2 class="mt-1 line-clamp-2 text-sm font-bold">${escapeHtml(item.product.title)}</h2><p class="mt-2 line-clamp-2 text-xs leading-5 text-stone-500">${escapeHtml(item.description || item.product.description || '고양이와 집사를 위한 추천 용품')}</p></div></a>`).join('');
    }
    function openModal(item) {
      $('modalCategory').textContent = `#${item.category || '추천'}`;
      $('modalImage').src = item.product.imageUrl;
      $('modalImage').alt = item.product.title;
      $('modalTitle').textContent = item.product.title;
      $('modalDescription').textContent = item.description || item.product.description || '고양이와 집사를 위한 추천 용품입니다.';
      $('modalLink').href = item.product.coupangUrl;
      $('modal').classList.replace('hidden', 'flex');
    }
    function closeModal() { $('modal').classList.replace('flex', 'hidden'); }
    $('closeModal').addEventListener('click', closeModal);
    $('modal').addEventListener('click', event => { if (event.target === $('modal')) closeModal(); });
    function escapeHtml(value) { return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char])); }
  </script>
  <div class="fixed inset-x-0 bottom-0 z-40">
    <div class="flex border-t border-orange-100 bg-orange-50">
      <a href="https://link.coupang.com/a/gKei5IuiwS" target="_blank" rel="noopener sponsored" class="flex-1 py-2 text-center text-[11px] font-semibold text-orange-700">로켓프레시</a>
      <a href="https://link.coupang.com/a/gKenl0nyO4" target="_blank" rel="noopener sponsored" class="flex-1 border-l border-orange-100 py-2 text-center text-[11px] font-semibold text-orange-700">로켓와우</a>
    </div>
    <a href="https://sumsumvill.blogspot.com/" target="_blank" rel="noopener" class="block bg-orange-500 py-3 text-center text-sm font-bold text-white shadow-[0_-8px_24px_rgba(0,0,0,.12)]" style="padding-bottom: max(0.75rem, env(safe-area-inset-bottom))">숨숨마을 블로그 바로가기</a>
  </div>
</body>
</html>
