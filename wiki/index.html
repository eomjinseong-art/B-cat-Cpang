<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="고양이 돌봄을 상황별로 모아 둔 숨숨위키">
  <title>숨숨위키 | 숨숨마을</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 text-stone-800" style="font-family:'Gowun Dodum', sans-serif">
  <header class="sticky top-0 z-20 border-b border-amber-100 bg-white/95 backdrop-blur">
    <div class="mx-auto max-w-5xl px-4 py-3">
      <div class="flex items-center justify-between gap-3">
        <a href="../" class="text-2xl font-black tracking-wide text-orange-600" style="font-family:'Jua', sans-serif">숨숨마을 <span class="hidden text-base font-medium tracking-normal text-stone-400 sm:inline">CAT GOODS</span></a>
        <a id="headerLink" href="#" target="_blank" rel="noopener" class="shrink-0 rounded-full bg-orange-500 px-3 py-2 text-xs font-bold text-white">오늘의 골드박스</a>
      </div>
      <nav class="mt-2 flex gap-4 text-sm font-bold">
        <a href="../" class="text-stone-400 hover:text-orange-600">용품</a>
        <a href="./" class="text-stone-900">숨숨위키</a>
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-5xl px-4 pb-40">
    <section class="py-8">
      <p class="mb-2 text-sm font-bold text-orange-600">숨숨위키</p>
      <h1 class="text-3xl font-black leading-tight sm:text-4xl">상황별로 찾는 고양이 돌봄</h1>
      <p class="mt-3 max-w-xl text-sm leading-6 text-stone-500">응급처럼 굴 일부터 밥·화장실·놀이까지. 글은 교육용이며 진료를 대신하지 않습니다.</p>
    </section>
    <nav class="sticky top-[5.5rem] z-10 -mx-4 mb-5 border-b border-amber-100 bg-amber-50/95 px-4 py-2 backdrop-blur">
      <div id="wikiCats" class="flex gap-2 overflow-x-auto pb-1"></div>
    </nav>
    <section id="guideGrid" class="grid gap-3 sm:grid-cols-2"></section>
    <section class="mt-10 rounded-2xl border border-amber-100 bg-white p-5">
      <h2 class="text-lg font-black">블로그에서 이어지는 글</h2>
      <p class="mt-2 text-sm leading-6 text-stone-500">입양, 첫 일주일, 건강 검진, 생애주기, 다묘, 여행은 숨숨마을 블로그에 모아 두었습니다.</p>
      <ul id="blogTopics" class="mt-4 grid gap-2 sm:grid-cols-2"></ul>
      <a id="blogCta" href="https://sumsumvill.blogspot.com/" target="_blank" rel="noopener" class="mt-5 inline-block rounded-xl bg-orange-500 px-4 py-3 text-sm font-bold text-white">숨숨마을 블로그 바로가기</a>
    </section>
  </main>
  <div class="fixed inset-x-0 bottom-0 z-40">
    <div class="flex border-t border-orange-100 bg-orange-50">
      <a href="https://link.coupang.com/a/gKei5IuiwS" target="_blank" rel="noopener sponsored" class="flex-1 py-2 text-center text-[11px] font-semibold text-orange-700">로켓프레시</a>
      <a href="https://link.coupang.com/a/gKenl0nyO4" target="_blank" rel="noopener sponsored" class="flex-1 border-l border-orange-100 py-2 text-center text-[11px] font-semibold text-orange-700">로켓와우</a>
    </div>
    <a href="https://sumsumvill.blogspot.com/" target="_blank" rel="noopener" class="block bg-orange-500 py-3 text-center text-sm font-bold text-white shadow-[0_-8px_24px_rgba(0,0,0,.12)]" style="padding-bottom: max(0.75rem, env(safe-area-inset-bottom))">숨숨마을 블로그 바로가기</a>
  </div>
  <script>
    const state = { guides: [], category: '전체', blog: 'https://sumsumvill.blogspot.com/' };
    const $ = id => document.getElementById(id);
    fetch('../data/config.json').then(r => r.json()).then(config => {
      $('headerLink').href = config.featuredLink;
      $('headerLink').textContent = config.featuredLabel;
    });
    fetch('./guides.json').then(r => r.json()).then(data => {
      state.guides = data.guides || [];
      state.blog = data.blog || state.blog;
      $('blogCta').href = state.blog;
      $('blogTopics').innerHTML = (data.blogTopics || []).map(item =>
        `<li><a href="${escapeHtml(state.blog)}" target="_blank" rel="noopener" class="flex items-baseline justify-between gap-3 rounded-xl bg-amber-50 px-3 py-3 hover:bg-orange-50"><span class="text-sm font-bold">${escapeHtml(item.title)}</span><span class="text-xs text-stone-400">${escapeHtml(item.note || '')}</span></a></li>`
      ).join('');
      renderCats();
      renderGuides();
    }).catch(() => {
      $('guideGrid').innerHTML = '<p class="rounded-xl bg-white p-8 text-center text-sm text-stone-400">위키 목록을 불러오지 못했습니다.</p>';
    });
    function cats() {
      return ['전체', ...[...new Set(state.guides.map(g => g.wikiCategory))]];
    }
    function chipClass(name) {
      return `shrink-0 rounded-full px-4 py-2 text-xs font-bold ${name === state.category ? 'bg-stone-900 text-white' : 'bg-white text-stone-500'}`;
    }
    function renderCats() {
      $('wikiCats').innerHTML = cats().map(name =>
        `<button type="button" data-cat="${escapeHtml(name)}" class="${chipClass(name)}">${escapeHtml(name)}</button>`
      ).join('');
      $('wikiCats').querySelectorAll('button').forEach(button => {
        button.addEventListener('click', () => {
          state.category = button.dataset.cat;
          renderCats();
          renderGuides();
        });
      });
    }
    function renderGuides() {
      const list = state.category === '전체'
        ? state.guides
        : state.guides.filter(g => g.wikiCategory === state.category);
      $('guideGrid').innerHTML = list.map(guide =>
        `<a href="./${encodeURIComponent(guide.slug)}.html" class="rounded-2xl border border-amber-100 bg-white p-5 shadow-sm transition hover:-translate-y-1 hover:shadow-md"><span class="text-[11px] font-bold text-orange-600">${escapeHtml(guide.wikiCategory)}</span><h2 class="mt-2 text-lg font-black">${escapeHtml(guide.title)}</h2><p class="mt-2 text-sm leading-6 text-stone-500">${escapeHtml(guide.description)}</p><p class="mt-3 text-xs text-stone-400">읽는 시간 약 ${guide.readMinutes}분</p></a>`
      ).join('');
    }
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char]));
    }
  </script>
</body>
</html>
